# main 브랜치에 다른 사람이 push(또는 PR merge)하면 지정한 사람에게 GitHub 알림을 보낸다.
# 방식: push된 최신 커밋에 @멘션 댓글을 단다 → GitHub 알림(웹/모바일/이메일)으로 전달된다.
# 본인이 push한 경우에는 아무것도 하지 않는다.
#
# Claude 요약: 저장소 Secrets에 아래 중 하나가 있으면 Claude가 변경 내용을 요약해 댓글에 붙인다.
#   - ANTHROPIC_API_KEY        (Anthropic API 키, 사용량만큼 과금)
#   - CLAUDE_CODE_OAUTH_TOKEN  (Claude Pro/Max 구독, 터미널에서 `claude setup-token`으로 발급)
# Secret이 없거나 요약이 실패해도 기존 알림 댓글은 그대로 달린다.
name: Notify on main push

on:
  push:
    branches: [main]

permissions:
  contents: write   # 커밋 댓글 작성에 필요
  id-token: write   # claude-code-action 인증에 필요

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      NOTIFY_USER: DoyoonHan  # 알림 받을 GitHub 아이디
      HAS_CLAUDE_AUTH: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    if: github.actor != 'DoyoonHan'
    steps:
      - name: Checkout (diff 비교용 전체 기록)
        if: env.HAS_CLAUDE_AUTH == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Summarize changes with Claude
        id: claude
        if: env.HAS_CLAUDE_AUTH == 'true'
        continue-on-error: true  # 요약이 실패해도 알림은 보낸다
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            이 저장소의 main 브랜치에 새 커밋이 push되었다.
            변경 범위: ${{ github.event.before }}..${{ github.sha }}

            `git log --oneline` 과 `git diff --stat`, `git diff` 로 위 범위의 변경을 확인하고,
            `.github/CODEOWNERS` 와 `docs/conventions.md` 를 참고해 아래를 한국어로 정리하라.

            1. 핵심 변경 요약: 3~5개 bullet, 파일 경로 포함
            2. 담당 영역 영향: 김한승(han0210, 이슈 분석) / 한도윤(DoyoonHan, 공시 분석) / 공동 중 어디가 바뀌었는지
            3. 확인 필요: 상대 담당 파일 수정, 공동 파일(src/common, dashboard/app.py, filters.py, 스키마) 변경,
               스키마 문서와 코드 불일치, API 키·.env·대용량 데이터 커밋 의심 등. 없으면 "없음"

            규칙: 파일을 수정하거나 커밋하지 않는다. 키나 토큰 값을 발견해도 값 자체는 절대 출력하지 않는다.
            결과는 GitHub 댓글에 그대로 들어가는 마크다운으로 summary 필드에 담는다.
          claude_args: |
            --permission-mode default
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
            --json-schema '{"type":"object","properties":{"summary":{"type":"string"}},"required":["summary"]}'

      - name: Comment on head commit with mention
        uses: actions/github-script@v7
        env:
          CLAUDE_OUTPUT: ${{ steps.claude.outputs.structured_output }}
        with:
          script: |
            const user = process.env.NOTIFY_USER;
            const commits = context.payload.commits || [];
            const lines = commits.slice(0, 20).map(c =>
              `- [\`${c.id.slice(0, 7)}\`](${c.url}) ${c.message.split('\n')[0]} — ${c.author.name}`
            );
            if (commits.length > 20) lines.push(`- …외 ${commits.length - 20}개`);

            let summary = '';
            try {
              const out = process.env.CLAUDE_OUTPUT;
              if (out) summary = JSON.parse(out).summary || '';
            } catch (e) {
              core.warning(`Claude 요약 파싱 실패: ${e.message}`);
            }

            const body = [
              `@${user} **${context.actor}** 님이 \`main\` 브랜치에 push 했습니다.`,
              '',
              `커밋 ${commits.length}개 · [변경사항 비교](${context.payload.compare})`,
              '',
              ...lines,
              ...(summary ? ['', '---', '### 🤖 Claude 변경 요약', '', summary] : []),
            ].join('\n');

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body,
            });
